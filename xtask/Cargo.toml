[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Not the checkout's workspace: that one's Cargo.toml takes libkrun from .libkrun, which this makes,
# so cargo couldn't load it to run this before it's made.
[workspace]

[dependencies]
bottle-formats = { path = "../formats" }
serde_json = "1"
sha2 = "0.11"

# The x86_64 kernel's ELF, checked by the loader libkrun loads it with (x86_64 only, as libkrun's is).
[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
linux-loader = { version = "0.13.2", features = ["elf"] }
vm-memory = { version = "=0.17.1", features = ["backend-mmap"] }

[workspace]
resolver = "3"
members = ["agent-proto", "agent", "agent-client", "net", "cli", "disk", "formats", "folio", "folio/standin"]
# xtask, a workspace of its own: it makes .libkrun, which loading this one takes (see
# xtask/src/libkrun.rs). .libkrun's crates are libkrun's, not this workspace's (their tests and
# dev-dependencies too), though they're in its directory.
exclude = ["xtask", ".libkrun"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
bottle-agent-client = { path = "agent-client" }
bottle-agent-proto = { path = "agent-proto" }
bottle-disk = { path = "disk" }
bottle-formats = { path = "formats" }
bottle-net = { path = "net" }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
libc = "0.2"
# The system's calls, safe: rustix's own (on Linux, without libc), where libc's would be unsafe ours.
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "termios", "mount", "system", "net", "event", "pipe", "thread", "param", "stdio"] }
# Signals, handled safely: a flag set, or signals read from a thread, instead of handlers of ours.
signal-hook = "0.4.6"
# The host side's caching: TLS with ring's crypto (no OpenSSL: macOS has none to link, and the
# distribution is one static binary), certificates minted from bottle-cli's caching CA, and the
# system's trust store for the hosts it fetches from.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
time = { version = "0.3", default-features = false }
# libkrun, linked: its C API, called directly. Its own init is ours instead (bottle-agent), so not
# its init-blob; disks, not its network devices (bottle's network is the agent's, over vsock).
# Upstream's release with this repo's patches, which `cargo xtask libkrun` makes (xtask/src/libkrun.rs
# pins the release; xtask/libkrun has the patches).
libkrun = { path = ".libkrun/src/libkrun", default-features = false, features = ["blk"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }

# What `cargo xtask dist --release` builds with: smaller (no symbols; one unit, optimized across
# crates), slower to build. The dev shims' distributions (bin/bottle-build) are cargo's release
# profile, unchanged, to build quickly.
[profile.distribution]
inherits = "release"
strip = true
lto = true
codegen-units = 1

[package]
name = "bottle-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
bottle-agent-client.workspace = true
bottle-agent-proto.workspace = true
bottle-disk.workspace = true
bottle-formats.workspace = true
bottle-net.workspace = true
libc.workspace = true
libkrun.workspace = true
rustix.workspace = true
signal-hook.workspace = true
serde.workspace = true
serde_json.workspace = true

# The tests that run another package's program (see `cargo xtask test`, which builds them and
# turns this on): without it, `cargo test` has none of them.
[features]
integration = []

[[test]]
name = "copy"
required-features = ["integration"]

[[test]]
name = "exec"
required-features = ["integration"]

[[test]]
name = "machine"
required-features = ["integration"]

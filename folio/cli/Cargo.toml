[package]
name = "folio-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# folio runs bottle's code by running bottle-cli, never by linking it: none of bottle's crates
# (bottle-cli, bottle-disk, bottle-agent*) is a dependency here (tests/boundary.rs checks).
[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

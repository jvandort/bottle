[package]
name = "folio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# folio runs bottle's code by running bottle-cli, never by linking it: of bottle's crates, only
# bottle-formats, the types of the JSON bottle-cli takes and gives, is a dependency here
# (tests/boundary.rs checks).
[dependencies]
bottle-formats.workspace = true
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
crossterm = { version = "=0.29.0", default-features = false, features = ["events"] }
flate2.workspace = true
tar.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook.workspace = true
time.workspace = true

[dev-dependencies]
libc.workspace = true
rcgen.workspace = true

# The tests that run another package's program (see `cargo xtask test`, which builds them and
# turns this on): without it, `cargo test` has none of them.
[features]
integration = []

[[test]]
name = "broker"
required-features = ["integration"]

[[test]]
name = "credentials"
required-features = ["integration"]

[[test]]
name = "drone"
required-features = ["integration"]

[[test]]
name = "end_to_end"
required-features = ["integration"]

[[test]]
name = "exec_cp"
required-features = ["integration"]

[[test]]
name = "git"
required-features = ["integration"]

[[test]]
name = "krun_contract"
required-features = ["integration"]

[[test]]
name = "machines"
required-features = ["integration"]

[[test]]
name = "notes"
required-features = ["integration"]

[[test]]
name = "pause"
required-features = ["integration"]

[[test]]
name = "picker"
required-features = ["integration"]

[[test]]
name = "rename"
required-features = ["integration"]

[[test]]
name = "runner"
required-features = ["integration"]

[[test]]
name = "serve"
required-features = ["integration"]

[[test]]
name = "sidecar"
required-features = ["integration"]

[[test]]
name = "threads"
required-features = ["integration"]
